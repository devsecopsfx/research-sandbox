name: Study
run-name: study-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Public third-party https GitHub URL
        required: true
      ref:
        description: Full 40-character commit SHA
        required: true
      setup:
        description: Setup command (public data only)
        default: 'true'
        required: true
      run:
        description: Study command
        required: true
      image:
        type: choice
        options: [node:20, python:3.12, golang:1.22]
        default: node:20
      minutes:
        description: Shared setup/run timeout in minutes (1..30)
        default: '10'
      request_id:
        description: Unique dispatch correlation identifier
        required: true
permissions: {}
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; sandbox repo only
        with:
          persist-credentials: false
      - name: Capture host egress
        run: |
          mkdir -p evidence
          # The shell writes its own PID, then exec preserves it (not sudo's PID).
          sudo sh -c 'echo $$ > evidence/capture.pid; ulimit -f 20480; exec tcpdump -i any -nn -U -C 10 -W 1 -w evidence/egress.pcap >evidence/capture.log 2>&1' &
          sudo sh -c 'echo $$ > evidence/dns.pid; ulimit -f 2048; exec tcpdump -i any -nn -l port 53 >evidence/dns.log 2>evidence/dns-capture.log' &
          sleep 1
          sudo kill -0 "$(cat evidence/capture.pid)" "$(cat evidence/dns.pid)"
      - name: Block subject metadata and host services
        run: |
          gateway=$(ip -4 -o addr show docker0 | awk '{split($4,a,"/"); print a[1]}')
          test -n "$gateway"
          for destination in 169.254.169.254 168.63.129.16 "$gateway"; do
            sudo iptables -I DOCKER-USER 1 -i docker0 -d "$destination" -j DROP
            # Traffic addressed to the host traverses INPUT, not FORWARD/DOCKER-USER.
            sudo iptables -I INPUT 1 -i docker0 -d "$destination" -j DROP
          done
          sudo iptables -S DOCKER-USER > evidence/egress-rules.txt
          sudo iptables -S INPUT >> evidence/egress-rules.txt
      - name: Run isolated subject
        env:
          STUDY_REPO: ${{ inputs.repo }}
          STUDY_REF: ${{ inputs.ref }}
          STUDY_SETUP: ${{ inputs.setup }}
          STUDY_RUN: ${{ inputs.run }}
          STUDY_IMAGE: ${{ inputs.image }}
          STUDY_MINUTES: ${{ inputs.minutes }}
          STUDY_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          unset GITHUB_TOKEN
          for variable in ${!ACTIONS_@}; do unset "$variable"; done
          python3 runner.py
      - name: Stop capture and report
        if: always()
        run: |
          sudo docker rm -f research-subject 2>/dev/null || true
          for file in evidence/capture.pid evidence/dns.pid; do
            if test -f "$file"; then sudo kill -INT "$(cat "$file")" || true; fi
          done
          sleep 2
          sudo chown -R "$(id -u):$(id -g)" evidence
          # tcpdump -W may append a rotation index even when only one file is kept.
          if test -f evidence/egress.pcap0; then mv evidence/egress.pcap0 evidence/egress.pcap; fi
          python3 report.py --directory evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: study-report
          path: evidence/
          retention-days: 7
          if-no-files-found: error
